[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.13"
files = [
	"app",
]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = '(^|/)(\\.venv|__pycache__)(/|$)'